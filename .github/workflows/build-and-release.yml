name: Build and Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ published ]

jobs:
  # Windows 构建任务
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        target: [portable, nsis, zip]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        npm install
        # 确保 electron-log 正确安装
        npm list electron-log || npm install electron-log@1.3.0 --save

    - name: Build application
      run: |
        npm run build

    - name: Build Windows ${{ matrix.target }} package
      run: |
        if ("${{ matrix.target }}" -eq "portable") {
          npm run dist:win-portable
        } elseif ("${{ matrix.target }}" -eq "nsis") {
          electron-builder --win nsis --publish=never
        } elseif ("${{ matrix.target }}" -eq "zip") {
          electron-builder --win zip --publish=never
        }

    - name: Upload Windows ${{ matrix.target }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.target }}-${{ github.sha }}
        path: |
          release/*.exe
          release/*.zip
        retention-days: 30

  # Linux 构建任务
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [AppImage, snap, deb]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        # 确保 electron-log 正确安装
        npm list electron-log || npm install electron-log@1.3.0 --save

    - name: Build application
      run: |
        npm run build

    - name: Build Linux ${{ matrix.target }} package
      run: |
        if ("${{ matrix.target }}" -eq "AppImage") {
          npm run dist:linux
        } else {
          electron-builder --linux ${{ matrix.target }} --publish=never
        }

    - name: Upload Linux ${{ matrix.target }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-${{ matrix.target }}-${{ github.sha }}
        path: |
          release/*.AppImage
          release/*.snap
          release/*.deb
        retention-days: 30

  # macOS 构建任务
  build-macos:
    runs-on: macos-latest

    strategy:
      matrix:
        target: [dmg, zip]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        # 确保 electron-log 正确安装
        npm list electron-log || npm install electron-log@1.3.0 --save

    - name: Build application
      run: |
        npm run build

    - name: Build macOS ${{ matrix.target }} package
      run: |
        electron-builder --mac ${{ matrix.target }} --publish=never

    - name: Upload macOS ${{ matrix.target }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.target }}-${{ github.sha }}
        path: |
          release/*.dmg
          release/*.zip
        retention-days: 30

  # 发布任务 (仅在创建 release 时运行)
  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Display structure of downloaded files
      run: ls -R

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          windows-portable-*/**/*.exe
          windows-nsis-*/**/*.exe
          windows-zip-*/**/*.zip
          linux-AppImage-*/**/*.AppImage
          linux-snap-*/**/*.snap
          linux-deb-*/**/*.deb
          macos-dmg-*/**/*.dmg
          macos-zip-*/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}