name: Build Windows Portable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '8.2.1'  # Match the project's required version

    - name: Install dependencies
      run: |
        npm install
        # 确保 electron-log 正确安装
        npm list electron-log || npm install electron-log@1.3.0 --save

    - name: Build application
      run: |
        npm run build

    - name: Install electron-builder
      run: |
        npm install electron-builder --save-dev

    - name: Build Windows Portable Executable
      run: |
        npx electron-builder --win portable --x64 --publish=never

    - name: Upload Portable Executable
      uses: actions/upload-artifact@v3
      with:
        name: windows-portable-executable
        path: release/*.exe