name: Windows Build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - name: "Portable"
            target: "portable"
            artifact_name: "portable-executable"
            file_pattern: "*.exe"
          - name: "Installer"
            target: "nsis"
            artifact_name: "installer"
            file_pattern: "*.exe"
          - name: "ZIP Package"
            target: "zip"
            artifact_name: "zip-package"
            file_pattern: "*.zip"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Python (for native modules)
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Visual Studio Build Tools
      uses: microsoft/setup-msbuild@v1.3

    - name: Install dependencies
      run: |
        npm install
        # 确保安装 electron-builder
        npm list electron-builder || npm install electron-builder --save-dev
        # 确保 electron-log 正确安装
        npm list electron-log || npm install electron-log@1.3.0 --save

    - name: Build application
      run: |
        npm run build

    - name: Build Windows ${{ matrix.name }} package
      run: |
        echo "Building ${{ matrix.name }} package..."
        if ("${{ matrix.target }}" -eq "portable") {
          npm run dist:win-portable
        } elseif ("${{ matrix.target }}" -eq "nsis") {
          electron-builder --win nsis --publish=never
        } elseif ("${{ matrix.target }}" -eq "zip") {
          electron-builder --win zip --publish=never        }

    - name: List release files
      run: |
        echo "Release directory contents:"
        Get-ChildItem -Path release -Recurse -File | ForEach-Object { Write-Host $_.FullName }

    - name: Upload ${{ matrix.name }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-${{ github.sha }}
        path: |
          release/${{ matrix.file_pattern }}
        retention-days: 30
        if-no-files-found: warn

  # 创建 Release (可选，仅在标签推送时)
  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          portable-executable-*/**/*.exe
          installer-*/**/*.exe
          zip-package-*/**/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}